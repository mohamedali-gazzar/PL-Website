name: Sync Fork

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with original repository
        run: |
          git remote add upstream https://github.com/mohamedali-gazzar/PL-Website.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
